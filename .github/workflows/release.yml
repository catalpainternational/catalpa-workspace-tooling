name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group test
      - run: uv run pytest
      - run: uv build
      - name: Verify wheel version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          wheel="$(ls -1 dist/*.whl | head -1)"
          wheel_version="$(python3 -c "
          import email, pathlib, zipfile
          wheel = pathlib.Path('${wheel}')
          with zipfile.ZipFile(wheel) as zf:
              meta = next(n for n in zf.namelist() if n.endswith('.dist-info/METADATA'))
              msg = email.message_from_bytes(zf.read(meta))
          print(msg['Version'])
          ")"
          echo "Tag version: $tag"
          echo "Wheel version: $wheel_version"
          test "$wheel_version" = "$tag"

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release notes from CHANGELOG
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(bash scripts/extract-changelog.sh "$version")"
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            echo "No CHANGELOG section for version $version" >&2
            exit 1
          fi
          {
            echo "body<<EOF"
            printf '%s\n' "$notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
