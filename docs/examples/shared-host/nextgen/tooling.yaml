# Stands in for Nextgen on the shared server: a plain env (one account, `deploy`).
project:
  name: nextgen
  root_marker: tooling.yaml
paths:
  backend: .
  frontend: .
  scripts: .
  env_local: .env.local
  email_backend_dir: email_out
  fetch_db_dump: docker/dumps/app.custom
  deploy:
    envs_dir: docker/envs
    images_config: docker/images.yaml
    default_compose: compose.yml
    dev_compose: compose.yml
stack:
  compose_project_default: nextgen
  services:
    web: web
    proxy: caddy
    db: db
  images:
    registry_key: image_registry
    components:
      web: demo-web
      proxy: demo-caddy
      db: demo-postgres
  healthcheck:
    service: web
    url: http://127.0.0.1:80/
ops:
  pgbackrest:
    data_volume: pgdata
