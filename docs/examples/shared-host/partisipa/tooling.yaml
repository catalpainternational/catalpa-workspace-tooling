# Stands in for Partisipa on the shared server: a blue/green site in three accounts (site,
# blue, green), running the test app tests/fixtures/fcos/bluegreen-app.
project:
  name: partisipa
  root_marker: tooling.yaml
paths:
  backend: .
  frontend: .
  scripts: .
  env_local: .env.local
  email_backend_dir: email_out
  fetch_db_dump: docker/dumps/app.custom
  deploy:
    envs_dir: docker/envs
    images_config: docker/images.yaml
    default_compose: compose.yml
    dev_compose: compose.yml
