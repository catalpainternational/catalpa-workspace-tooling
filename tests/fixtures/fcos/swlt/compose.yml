name: ${COMPOSE_PROJECT_NAME:-swlt_shape}

x-app-env: &app-env
  DATABASE_HOST: db
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
  EMAIL_HOST: mailpit
  SITE_AUTH: ${SITE_AUTH:-}

services:
  db:
    image: ${STACK_IMAGE_REGISTRY:-ghcr.io/example}/swlt-postgres:${STACK_IMAGE_TAG:-latest}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: pg_isready -U postgres
      interval: 5s

  migrate:
    image: ${STACK_IMAGE_REGISTRY:-ghcr.io/example}/swlt-django:${STACK_IMAGE_TAG:-latest}
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  django:
    image: ${STACK_IMAGE_REGISTRY:-ghcr.io/example}/swlt-django:${STACK_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    environment: *app-env
    volumes:
      - django_media:/app/media
      - django_private_uploads:/app/private_uploads
    tmpfs:
      - /tmp
    depends_on:
      migrate:
        condition: service_completed_successfully

  rqscheduler:
    image: ${STACK_IMAGE_REGISTRY:-ghcr.io/example}/swlt-django:${STACK_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: python manage.py rqscheduler --interval 60
    environment: *app-env
    depends_on:
      - redis

  redis:
    image: redis:8-alpine
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  caddy:
    image: ${STACK_IMAGE_REGISTRY:-ghcr.io/example}/swlt-caddy:${STACK_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-localhost}
      CADDY_SITE_AUTH: ${CADDY_SITE_AUTH:-}
      SITE_AUTH: ${SITE_AUTH:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - django_media:/srv/media:ro
    depends_on:
      - django

volumes:
  postgres_data:
  django_media:
  django_private_uploads:
  caddy_data:
