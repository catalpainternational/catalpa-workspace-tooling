# Generated by `dk staging fcos render` from compose.yaml. Do not edit: change the compose file or info.yaml and render again.
# The same item keys as dk's userparams on Ubuntu, read from backup-status.sh's files.
UserParameter=pgbackrest.info,cat /var/lib/bero_shape-monitor/pgbackrest-info.json
UserParameter=restic.snapshots,cat /var/lib/bero_shape-monitor/restic-snapshots.json
# When each file was last written. backup-status.sh keeps the previous file when a
# run fails, so a stuck job shows only as an old file: the template
# docs/zabbix/catalpa-backup-status-fcos.yaml (catalpa-workspace-tooling) alerts on it.
# Fixed keys, so the one template fits every project's directory.
Alias=backup.status.pgbackrest.mtime:vfs.file.time[/var/lib/bero_shape-monitor/pgbackrest-info.json,modify]
Alias=backup.status.restic.mtime:vfs.file.time[/var/lib/bero_shape-monitor/restic-snapshots.json,modify]
