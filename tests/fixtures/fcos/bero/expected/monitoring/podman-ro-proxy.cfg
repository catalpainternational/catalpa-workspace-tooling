# Generated by `dk staging render` from compose.yaml. Do not edit: change the compose file or info.yaml and render again.
# Only GET/HEAD to the endpoints the Docker plugin uses; anything that changes state or
# could leak more than state and resource use (logs, archive, exec, secrets) gets 403.
global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend podman_ro
    # /run/bero_shape-podman-ro on the host: 0750 with group 1995, the agent's.
    bind unix@/run/podman-ro/podman.sock mode 666
    http-request deny deny_status 403 unless { method GET HEAD }
    http-request deny deny_status 403 unless { path -m reg ^(/v[0-9.]+)?/(_ping|version|info|system/df|images/json|containers/json|containers/[A-Za-z0-9_.-]+/(json|stats))$ }
    default_backend podman

backend podman
    server podman unix@/run/podman/podman.sock
