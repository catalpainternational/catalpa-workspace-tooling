project:
  name: bero_shape
  root_marker: tooling.yaml
paths:
  backend: app
  frontend: app
  scripts: tools
  env_local: .env.local
  email_backend_dir: email_out
  fetch_db_dump: docker/dumps/app.custom
  deploy:
    envs_dir: docker/envs
    images_config: docker/images.yaml
    default_compose: compose.yaml
    dev_compose: compose.yaml
stack:
  compose_project_default: bero_shape
  services:
    web: django
    proxy: caddy
    db: db
  images:
    registry_key: image_registry
    components:
      web: bero_shape-django
      proxy: bero_shape-caddy
      db: bero_shape-db
  healthcheck:
    service: django
    url: http://127.0.0.1:8000/
ops:
  pgbackrest:
    data_volume: postgres_data
  restic:
    data_volume: django_media
  zabbix:
    unit_name: bero_shape-zabbix-agent2.service
    userparams_file: 99-bero_shape-userparams.conf
  systemd_units:
    pgbackrest:
      - bero_shape-pgbackrest-backup-full.service
      - bero_shape-pgbackrest-backup-incr.service
      - bero_shape-pgbackrest-backup-full.timer
      - bero_shape-pgbackrest-backup-incr.timer
    restic:
      - bero_shape-restic-files-backup.service
      - bero_shape-restic-files-backup.timer
    timers_enable_pgbackrest:
      - bero_shape-pgbackrest-backup-full.timer
      - bero_shape-pgbackrest-backup-incr.timer
    timers_enable_restic:
      - bero_shape-restic-files-backup.timer
digitalocean:
  timezone: Asia/Dili
