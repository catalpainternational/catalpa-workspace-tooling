[project]
name = "catalpa-workspace-tooling"
dynamic = ["version"]
description = "Deploy and development CLIs driven by a repo-root tooling.yaml manifest"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6", "python-dotenv>=1", "honcho>=2.0,<3", "segno>=1.6"]

[project.optional-dependencies]
completion = ["argcomplete>=3.2"]

[project.scripts]
native = "catalpa_tooling.native_cli:main"
local = "catalpa_tooling.native_cli:main"
dev = "catalpa_tooling.native_cli:main"
dk = "catalpa_tooling.dk_cli:main"
test = "catalpa_tooling.test_cli:main"
scripts = "catalpa_tooling.scripts_cli:main"
setup-shell = "catalpa_tooling.setup_shell_cli:main"
setup-vscode = "catalpa_tooling.setup_vscode_cli:main"

[dependency-groups]
test = ["pytest>=8.4", "argcomplete>=3.2"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/catalpa_tooling"]

[tool.hatch.build.hooks.vcs]
version-file = "src/catalpa_tooling/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
