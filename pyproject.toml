[project]
name = "catalpa-workspace-tooling"
version = "0.1.0"
description = "Deploy and development CLIs driven by a repo-root tooling.yaml manifest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6", "python-dotenv>=1"]

[project.scripts]
dev = "catalpa_tooling.dev_cli:main"
dk = "catalpa_tooling.dk_cli:main"
test = "catalpa_tooling.test_cli:main"
scripts = "catalpa_tooling.scripts_cli:main"

[dependency-groups]
test = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalpa_tooling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
